name: Deploy su GitHub Pages

# Deploy automatico del sito statico a ogni push su main.
on:
  push:
    branches: [main]
  workflow_dispatch: # avvio manuale dalla tab Actions

# Permessi necessari al deploy su Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta; non annulla quello in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica l'artifact del sito
        uses: actions/upload-pages-artifact@v3
        with:
          # L'app è statica alla root del repo: pubblichiamo tutta la cartella.
          path: .

      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
